<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="albumBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe4e6"/>
      <stop offset="50%" stop-color="#fecdd3"/>
      <stop offset="100%" stop-color="#fda4af"/>
    </linearGradient>
    <radialGradient id="vinylCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </radialGradient>
  </defs>

  <!-- Album Sleeve -->
  <rect width="300" height="300" rx="20" fill="url(#albumBg)"/>

  <!-- Vinyl Record Outer Ring -->
  <circle cx="150" cy="150" r="120" fill="#2d1820"/>
  <!-- Grooves -->
  <circle cx="150" cy="150" r="110" fill="none" stroke="#432833" stroke-width="1.5"/>
  <circle cx="150" cy="150" r="98" fill="none" stroke="#432833" stroke-width="1.2"/>
  <circle cx="150" cy="150" r="86" fill="none" stroke="#432833" stroke-width="1.2"/>
  <circle cx="150" cy="150" r="74" fill="none" stroke="#432833" stroke-width="1"/>

  <!-- Center Label -->
  <circle cx="150" cy="150" r="48" fill="url(#vinylCenter)"/>
  <circle cx="150" cy="150" r="45" fill="none" stroke="#fecdd3" stroke-width="1.5"/>

  <!-- Center Spindle Hole -->
  <circle cx="150" cy="150" r="9" fill="#2d1820" stroke="#fda4af" stroke-width="2"/>

  <!-- Music Heart Icon on label -->
  <path d="M 150 128 C 145 120 134 122 134 130 C 134 138 150 146 150 146 C 150 146 166 138 166 130 C 166 122 155 120 150 128 Z" fill="#ffffff" opacity="0.95"/>

  <!-- Sparkles around sleeve -->
  <circle cx="50" cy="50" r="4" fill="#f43f5e" opacity="0.6"/>
  <circle cx="260" cy="65" r="3" fill="#f43f5e" opacity="0.6"/>
  <circle cx="245" cy="245" r="5" fill="#f43f5e" opacity="0.5"/>
  <circle cx="55" cy="240" r="3" fill="#f43f5e" opacity="0.6"/>
</svg>
