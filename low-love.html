<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Friendship Check 💕 | Dhanya's Storybook</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧸</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      width: 100%;
      background: radial-gradient(ellipse at 50% 25%, #fff1f2 0%, #fdf2f8 50%, #fce7f3 100%);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #371b26;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* Subtle ambient blur accents */
    .ambient-glow {
      position: fixed;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(251, 113, 133, 0.18) 0%, transparent 70%);
      filter: blur(40px);
      pointer-events: none;
      z-index: 0;
    }
    .glow-top { top: -60px; right: -40px; }
    .glow-bottom { bottom: -60px; left: -40px; }

    /* Clean, Professional Glassmorphism Card */
    .card-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 370px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      border: 1px solid rgba(244, 63, 94, 0.14);
      box-shadow: 
        0 24px 50px -12px rgba(225, 29, 72, 0.12),
        0 4px 20px rgba(0, 0, 0, 0.03);
      padding: 28px 24px 26px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: cardPop 0.4s cubic-bezier(0.34, 1.45, 0.64, 1) forwards;
    }

    @keyframes cardPop {
      0% { transform: scale(0.94) translateY(14px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    /* Minimal Pill Badge */
    .pill-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #e11d48;
      background: #ffe4e6;
      padding: 5px 14px;
      border-radius: 999px;
      margin-bottom: 14px;
      border: 1px solid rgba(244, 63, 94, 0.15);
    }

    /* 3D Teddy Stage */
    .teddy-stage {
      position: relative;
      width: 180px;
      height: 175px;
      margin: 4px auto 12px;
      perspective: 800px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .teddy-shadow {
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: 140px;
      height: 18px;
      background: radial-gradient(ellipse at center, rgba(140, 70, 85, 0.35) 0%, rgba(225, 29, 72, 0.12) 45%, transparent 70%);
      border-radius: 50%;
      filter: blur(4px);
      animation: shadowPulse 3.2s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes shadowPulse {
      0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.8; }
      50% { transform: translateX(-50%) scale(0.92, 0.8); opacity: 0.55; }
    }

    .teddy-character {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: teddyFloat 3.2s infinite ease-in-out;
      transition: transform 0.15s ease-out;
      cursor: pointer;
    }

    @keyframes teddyFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    .teddy-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 12px 18px rgba(180, 80, 95, 0.22));
      transition: transform 0.2s ease;
    }

    .teddy-character:hover .teddy-img {
      transform: scale(1.04);
    }

    /* Clean Heading */
    .card-title {
      font-size: 24px;
      font-weight: 700;
      color: #1f1217;
      line-height: 1.25;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .percent-badge {
      display: inline-block;
      background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
      color: #ffffff;
      font-weight: 800;
      font-size: 21px;
      padding: 1px 10px;
      border-radius: 999px;
      box-shadow: 0 4px 12px rgba(244, 63, 94, 0.28);
    }

    /* 1-Line Clean Subtitle */
    .card-subtitle {
      font-size: 14px;
      font-weight: 500;
      color: #715560;
      line-height: 1.45;
      margin-bottom: 22px;
      max-width: 290px;
    }

    /* Sleek, Professional Pill Button */
    .btn-action {
      width: 100%;
      height: 48px;
      padding: 0 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
      color: #ffffff;
      border: none;
      border-radius: 999px;
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.2px;
      cursor: pointer;
      box-shadow: 0 10px 24px -3px rgba(225, 29, 72, 0.36);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      user-select: none;
      text-decoration: none;
      position: relative;
      overflow: hidden;
    }

    .btn-action::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -90%;
      width: 50%;
      height: 200%;
      background: linear-gradient(
        to right,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.35) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: rotate(25deg);
      animation: btnShimmer 3.2s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes btnShimmer {
      0% { left: -90%; }
      35%, 100% { left: 140%; }
    }

    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px -2px rgba(225, 29, 72, 0.44);
    }

    .btn-action:active {
      transform: scale(0.97);
    }

    /* Happy Transition Overlay */
    .happy-overlay {
      position: fixed;
      inset: 0;
      background: rgba(255, 241, 242, 0.96);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
      padding: 24px;
      text-align: center;
    }

    .happy-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .happy-card {
      width: 140px;
      height: 140px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 16px 36px -8px rgba(244, 63, 94, 0.35);
      animation: happyBounce 0.75s infinite alternate cubic-bezier(0.34, 1.56, 0.64, 1);
      margin-bottom: 16px;
      background: #ffffff;
    }

    @keyframes happyBounce {
      from { transform: translateY(0) scale(0.97); }
      to { transform: translateY(-12px) scale(1.04); }
    }

    .happy-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .happy-title {
      font-size: 26px;
      font-weight: 800;
      color: #e11d48;
      line-height: 1.2;
    }

    .happy-subtitle {
      font-size: 14px;
      color: #715560;
      font-weight: 600;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="ambient-glow glow-top"></div>
  <div class="ambient-glow glow-bottom"></div>

  <!-- Professional, Clean Card -->
  <main class="card-container">
    
    <div class="pill-badge">
      <span>💕</span>
      <span>Friendship Check</span>
    </div>

    <!-- 3D Crying Teddy Bear with Broken Heart -->
    <div class="teddy-stage" id="teddyStage">
      <div class="teddy-shadow"></div>
      <div class="teddy-character" id="teddyCharacter" title="Tap to comfort Teddy!">
        <img src="assets/teddy-sad-percent-cutout.png" alt="Sad Teddy Bear" class="teddy-img">
      </div>
    </div>

    <!-- Clean, Focused Heading -->
    <h1 class="card-title">
      Wait... only <span class="percent-badge" id="percentPill">76%</span>? 🥺
    </h1>
    
    <!-- 1-Line Sweet Message -->
    <p class="card-subtitle" id="cardSubtitle">
      Our friendship deserves a full 100% ✨
    </p>

    <!-- Professional 1-Line Button -->
    <button class="btn-action" id="fixAnswerBtn">
      <span>Give 100% Friendship</span>
      <span>›</span>
    </button>

  </main>

  <!-- Smooth Return Overlay -->
  <div class="happy-overlay" id="happyOverlay">
    <div class="happy-card">
      <img src="assets/teddy-happy-3d.jpg" alt="Happy Teddy Bear" class="happy-img">
    </div>
    <div class="happy-title">Yay! Let's make it 100%! 🥰</div>
    <p class="happy-subtitle">Taking you back to your question...</p>
  </div>

  <script>
    // Read percent and question from URL
    const urlParams = new URLSearchParams(window.location.search);
    let percent = urlParams.get('percent');
    let questionNum = urlParams.get('q') || '1';

    if (!percent) {
      percent = sessionStorage.getItem('dhanya_low_percent') || '0';
    }
    percent = parseInt(percent, 10);
    if (isNaN(percent)) percent = 0;

    const percentPill = document.getElementById('percentPill');
    const cardSubtitle = document.getElementById('cardSubtitle');
    if (percentPill) percentPill.textContent = `${percent}%`;

    if (percent === 0) {
      if (cardSubtitle) cardSubtitle.textContent = "Not even 1%? Let's fix that to 100% 💕";
    }

    // Interactive Teddy tap reaction
    const teddyCharacter = document.getElementById('teddyCharacter');
    if (teddyCharacter) {
      teddyCharacter.addEventListener('click', () => {
        teddyCharacter.style.transform = 'scale(0.92)';
        setTimeout(() => {
          teddyCharacter.style.transform = '';
        }, 180);
      });
    }

    // Action button
    const fixAnswerBtn = document.getElementById('fixAnswerBtn');
    const happyOverlay = document.getElementById('happyOverlay');

    if (fixAnswerBtn) {
      fixAnswerBtn.addEventListener('click', () => {
        if (happyOverlay) happyOverlay.classList.add('active');

        sessionStorage.setItem('dhanya_last_scene', '2');
        sessionStorage.setItem('dhanya_last_question', questionNum);
        sessionStorage.setItem('dhanya_from_low_love', 'true');

        setTimeout(() => {
          window.location.href = 'index.html';
        }, 650);
      });
    }
  </script>
</body>
</html>
