<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="40%" stop-color="#f43f5e"/>
      <stop offset="70%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>
    <linearGradient id="warmSun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="heartGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Twilight Sky Background -->
  <rect width="500" height="500" rx="16" fill="url(#skyGrad)"/>

  <!-- Warm Glowing Moon / Sunset Orb -->
  <circle cx="250" cy="220" r="110" fill="url(#warmSun)" opacity="0.85" filter="url(#softGlow)"/>

  <!-- Stars & Sparkles -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="80" cy="80" r="2.5"/>
    <circle cx="120" cy="140" r="1.5"/>
    <circle cx="390" cy="90" r="2"/>
    <circle cx="430" cy="160" r="2.5"/>
    <circle cx="350" cy="50" r="3"/>
    <circle cx="60" cy="200" r="2"/>
    <!-- Twinkle stars -->
    <path d="M 200 70 Q 200 78 192 78 Q 200 78 200 86 Q 200 78 208 78 Q 200 78 200 70 Z"/>
    <path d="M 310 110 Q 310 116 304 116 Q 310 116 310 122 Q 310 116 316 116 Q 310 116 310 110 Z"/>
  </g>

  <!-- Romantic Fairy Light Garland Arc -->
  <path d="M 20 60 Q 250 130 480 70" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <circle cx="80" cy="78" r="5" fill="#fef08a" filter="url(#softGlow)"/>
  <circle cx="150" cy="95" r="5.5" fill="#fda4af" filter="url(#softGlow)"/>
  <circle cx="230" cy="104" r="6" fill="#fef08a" filter="url(#softGlow)"/>
  <circle cx="310" cy="101" r="5.5" fill="#fda4af" filter="url(#softGlow)"/>
  <circle cx="390" cy="87" r="5" fill="#fef08a" filter="url(#softGlow)"/>

  <!-- Floating Love Heart -->
  <g transform="translate(250, 160) scale(1.2)" filter="url(#softGlow)">
    <path d="M 0 -8 C -10 -20 -24 0 0 20 C 24 0 10 -20 0 -8 Z" fill="url(#heartGlow)"/>
  </g>

  <!-- Sweet Couple Silhouette with Heart Sparkles -->
  <g fill="#2e0513">
    <!-- Hill / Bench Base -->
    <path d="M 0 420 Q 250 360 500 420 L 500 500 L 0 500 Z"/>

    <!-- Left Figure (Cute side-profile leaning in) -->
    <!-- Head -->
    <circle cx="215" cy="285" r="28"/>
    <!-- Hair bun / flow -->
    <circle cx="195" cy="275" r="14"/>
    <!-- Torso leaning right -->
    <path d="M 180 395 C 185 330 205 315 225 315 C 240 315 245 340 245 395 Z"/>

    <!-- Right Figure (Arm around left figure) -->
    <!-- Head -->
    <circle cx="275" cy="280" r="30"/>
    <!-- Torso -->
    <path d="M 245 395 C 245 325 260 310 285 310 C 310 310 325 335 325 395 Z"/>
    <!-- Arm resting gently -->
    <path d="M 290 330 C 270 345 225 345 210 360" stroke="#2e0513" stroke-width="12" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Cute Sparkles on Bottom Hill -->
  <circle cx="140" cy="425" r="3" fill="#fef08a" opacity="0.8"/>
  <circle cx="370" cy="430" r="3" fill="#fef08a" opacity="0.8"/>
  <circle cx="250" cy="455" r="3.5" fill="#fda4af" opacity="0.8"/>

  <!-- Soft Vignette Border -->
  <rect width="500" height="500" rx="16" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>
</svg>
