<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <linearGradient id="roseRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="rosePink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fecdd3"/>
      <stop offset="60%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="rosePeach" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="60%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="wrapPaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="50%" stop-color="#ffe4e6"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </linearGradient>
    <filter id="bouquetGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f43f5e" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Ambient Shimmer Dots -->
  <g fill="#f59e0b" opacity="0.75">
    <circle cx="80" cy="90" r="3" />
    <circle cx="330" cy="110" r="3.5" />
    <circle cx="60" cy="220" r="2.5" />
    <circle cx="340" cy="240" r="3" />
    <!-- Twinkle stars -->
    <path d="M 120 60 Q 120 68 112 68 Q 120 68 120 76 Q 120 68 128 68 Q 120 68 120 60 Z"/>
    <path d="M 280 80 Q 280 88 272 88 Q 280 88 280 96 Q 280 88 288 88 Q 280 88 280 80 Z"/>
  </g>

  <!-- Wrapping Paper Back Cone -->
  <g filter="url(#bouquetGlow)">
    <polygon points="120,220 280,220 200,430" fill="url(#wrapPaper)" stroke="#fda4af" stroke-width="2"/>
  </g>

  <!-- Green Foliage Leaves -->
  <!-- Left Leaf -->
  <path d="M 140 220 C 100 190 90 140 120 120 C 150 140 150 180 140 220 Z" fill="url(#leafGrad)"/>
  <path d="M 120 120 Q 135 170 140 220" stroke="#15803d" stroke-width="1.5" fill="none"/>
  <!-- Right Leaf -->
  <path d="M 260 220 C 300 190 310 140 280 120 C 250 140 250 180 260 220 Z" fill="url(#leafGrad)"/>
  <path d="M 280 120 Q 265 170 260 220" stroke="#15803d" stroke-width="1.5" fill="none"/>
  <!-- Top Center Leaf -->
  <path d="M 200 130 C 180 80 220 80 200 130 Z" fill="url(#leafGrad)"/>

  <!-- Roses Cluster -->
  <!-- Left Pink Rose -->
  <g transform="translate(130, 160) scale(0.9)">
    <circle cx="0" cy="0" r="38" fill="url(#rosePink)"/>
    <path d="M -25 -5 C -25 -25 0 -35 20 -20 C 35 -5 25 25 0 30 C -25 25 -35 5 -25 -5 Z" fill="#f43f5e" opacity="0.85"/>
    <path d="M -15 0 C -15 -15 5 -20 15 -10 C 20 0 15 15 0 18 C -15 15 -20 5 -15 0 Z" fill="#e11d48"/>
    <circle cx="0" cy="0" r="8" fill="#ffe4e6"/>
  </g>

  <!-- Right Peach Rose -->
  <g transform="translate(270, 165) scale(0.85)">
    <circle cx="0" cy="0" r="38" fill="url(#rosePeach)"/>
    <path d="M -25 -5 C -25 -25 0 -35 20 -20 C 35 -5 25 25 0 30 C -25 25 -35 5 -25 -5 Z" fill="#fb923c" opacity="0.85"/>
    <path d="M -15 0 C -15 -15 5 -20 15 -10 C 20 0 15 15 0 18 C -15 15 -20 5 -15 0 Z" fill="#ea580c"/>
    <circle cx="0" cy="0" r="8" fill="#fff7ed"/>
  </g>

  <!-- Top Center Rose -->
  <g transform="translate(200, 120) scale(0.95)">
    <circle cx="0" cy="0" r="40" fill="url(#rosePink)"/>
    <path d="M -28 -5 C -28 -28 0 -38 22 -22 C 38 -5 28 28 0 32 C -28 28 -38 5 -28 -5 Z" fill="#f43f5e" opacity="0.85"/>
    <path d="M -16 0 C -16 -16 6 -22 16 -12 C 22 0 16 16 0 20 C -16 16 -22 5 -16 0 Z" fill="#e11d48"/>
    <circle cx="0" cy="0" r="9" fill="#ffe4e6"/>
  </g>

  <!-- Main Center Crimson Rose (Foreground) -->
  <g transform="translate(200, 185) scale(1.1)" filter="url(#bouquetGlow)">
    <circle cx="0" cy="0" r="42" fill="url(#roseRed)"/>
    <!-- Petal whorls -->
    <path d="M -30 -8 C -30 -30 0 -40 24 -24 C 40 -8 30 30 0 34 C -30 30 -40 8 -30 -8 Z" fill="#e11d48"/>
    <path d="M -18 0 C -18 -18 6 -24 18 -12 C 24 0 18 18 0 22 C -18 18 -24 5 -18 0 Z" fill="#be123c"/>
    <path d="M -8 2 C -8 -8 4 -10 10 -4 C 12 2 8 10 0 12 C -8 10 -10 4 -8 2 Z" fill="#fff1f2" opacity="0.9"/>
  </g>

  <!-- Wrapping Paper Front Fold Over -->
  <polygon points="120,220 200,280 280,220 200,430" fill="url(#wrapPaper)" stroke="#f43f5e" stroke-width="1.5" opacity="0.95"/>

  <!-- Satin Ribbon & Bow -->
  <ellipse cx="200" cy="330" rx="14" ry="10" fill="#f43f5e"/>
  <!-- Bow loops -->
  <path d="M 200 330 C 160 300 150 350 195 335 Z" fill="#e11d48"/>
  <path d="M 200 330 C 240 300 250 350 205 335 Z" fill="#e11d48"/>
  <!-- Ribbon tails -->
  <path d="M 195 335 Q 170 370 175 400" stroke="#f43f5e" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 205 335 Q 230 370 225 400" stroke="#f43f5e" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Heart Tag -->
  <g transform="translate(200, 375)">
    <path d="M 0 -10 C -12 -22 -28 0 0 22 C 28 0 12 -22 0 -10 Z" fill="#ffffff" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="0" y="7" font-family="'Caveat', cursive" font-size="11.5" font-weight="700" fill="#e11d48" text-anchor="middle">For Buntyyyyyyyy ❤️</text>
  </g>
</svg>
