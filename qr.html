<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Special Birthday Wish for You 💖 | Scan QR Code</title>
  <meta name="description" content="A special romantic heart QR code scanner card for Dhanya's birthday wishes.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark-1: #0b141a;
      --bg-dark-2: #111b21;
      --wa-green: #005c4b;
      --wa-green-hover: #007a63;
      --wa-light: #e9edef;
      --wa-muted: #8696a0;
      --tick-blue: #53bdeb;
      --rose-primary: #e11d48;
      --rose-glow: rgba(225, 29, 72, 0.4);
      --laser-cyan: #06b6d4;
      --laser-glow: rgba(6, 182, 212, 0.8);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at center top, #182229 0%, #0b141a 70%, #060a0d 100%);
      color: var(--wa-light);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
      padding: 20px 16px 40px;
    }

    /* Subtle WhatsApp doodle background overlay */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
      z-index: 0;
    }

    /* Floating particles / hearts */
    .particles-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .heart-particle {
      position: absolute;
      color: rgba(225, 29, 72, 0.25);
      animation: floatUp 12s linear infinite;
      user-select: none;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(105vh) scale(0.6) rotate(0deg);
        opacity: 0;
      }
      15% {
        opacity: 0.8;
      }
      85% {
        opacity: 0.6;
      }
      100% {
        transform: translateY(-10vh) scale(1.1) rotate(360deg);
        opacity: 0;
      }
    }

    /* Main Container */
    .scanner-app {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Top Bar */
    .header-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px 18px;
      margin-bottom: 4px;
    }

    .chat-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f43f5e, #be123c);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3);
    }

    .chat-meta h2 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chat-meta span {
      font-size: 0.78rem;
      color: #25d366;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .chat-meta span::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #25d366;
    }

    .action-icons {
      display: flex;
      gap: 12px;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      transform: scale(1.05);
    }

    /* WhatsApp Bubble 1 */
    .bubble-wrapper {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      margin-bottom: 16px;
    }

    .wa-bubble {
      background: var(--wa-green);
      color: var(--wa-light);
      padding: 10px 16px 8px 16px;
      border-radius: 18px 18px 4px 18px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
      position: relative;
      display: inline-flex;
      align-items: baseline;
      gap: 12px;
      max-width: 90%;
      animation: popIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .bubble-text {
      font-size: 0.98rem;
      font-weight: 500;
      line-height: 1.4;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .bubble-meta {
      font-size: 0.72rem;
      color: var(--wa-muted);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 4px;
    }

    .bubble-ticks {
      color: var(--tick-blue);
      font-weight: 800;
      letter-spacing: -2px;
      font-size: 0.85rem;
    }

    /* Scanner Viewfinder Box */
    .viewfinder-card {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      max-width: 390px;
      margin: 10px 0 20px;
      border-radius: 28px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s ease;
      cursor: pointer;
    }

    .viewfinder-card:hover {
      transform: translateY(-2px);
    }

    /* Corner brackets */
    .bracket {
      position: absolute;
      width: 44px;
      height: 44px;
      border: 4.5px solid #ffffff;
      z-index: 15;
      pointer-events: none;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.5));
    }

    .bracket.tl {
      top: 6px;
      left: 6px;
      border-right: none;
      border-bottom: none;
      border-top-left-radius: 18px;
    }

    .bracket.tr {
      top: 6px;
      right: 6px;
      border-left: none;
      border-bottom: none;
      border-top-right-radius: 18px;
    }

    .bracket.bl {
      bottom: 6px;
      left: 6px;
      border-right: none;
      border-top: none;
      border-bottom-left-radius: 18px;
    }

    .bracket.br {
      bottom: 6px;
      right: 6px;
      border-left: none;
      border-top: none;
      border-bottom-right-radius: 18px;
    }

    /* Inner QR Code White Card */
    .qr-inner-card {
      width: 100%;
      height: 100%;
      background: #ffffff;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .qr-img {
      width: 90%;
      height: 90%;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 2px 8px rgba(225, 29, 72, 0.15));
      transition: transform 0.4s ease;
    }

    .viewfinder-card:hover .qr-img {
      transform: scale(1.02);
    }

    /* Animated Scanning Laser Line */
    .scanner-laser {
      position: absolute;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent 0%, var(--laser-cyan) 30%, #fff 50%, var(--laser-cyan) 70%, transparent 100%);
      box-shadow: 0 0 18px 4px var(--laser-glow), 0 0 8px 2px #fff;
      z-index: 12;
      animation: scanSweep 3.2s ease-in-out infinite alternate;
      pointer-events: none;
      border-radius: 4px;
    }

    @keyframes scanSweep {
      0% {
        top: 12%;
        opacity: 0.85;
      }
      50% {
        opacity: 1;
      }
      100% {
        top: 86%;
        opacity: 0.85;
      }
    }

    /* WhatsApp Bubble 2 */
    .bubble-wrapper-2 {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      margin-bottom: 24px;
    }

    .bubble-wrapper-2 .wa-bubble {
      animation-delay: 0.2s;
    }

    /* Camera Controls Bar */
    .camera-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 36px;
      margin-bottom: 24px;
    }

    .cam-btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: rgba(32, 44, 51, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 22px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(8px);
    }

    .cam-btn:hover {
      background: rgba(45, 62, 72, 0.95);
      transform: scale(1.08);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .cam-btn.active {
      background: #facc15;
      color: #0b141a;
      box-shadow: 0 0 20px rgba(250, 204, 21, 0.6);
    }

    /* Interactive Action Buttons */
    .button-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 6px;
    }

    .primary-btn {
      width: 100%;
      padding: 14px 20px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #e11d48, #be123c);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(225, 29, 72, 0.4);
      transition: all 0.25s ease;
      text-decoration: none;
    }

    .primary-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(225, 29, 72, 0.55);
      background: linear-gradient(135deg, #f43f5e, #e11d48);
    }

    .secondary-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
    }

    .secondary-btn {
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.06);
      color: var(--wa-light);
      font-size: 0.86rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
      text-decoration: none;
    }

    .secondary-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }

    /* Tip note */
    .scan-hint {
      margin-top: 18px;
      font-size: 0.8rem;
      color: var(--wa-muted);
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    @keyframes popIn {
      0% {
        transform: scale(0.85);
        opacity: 0;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      background: rgba(32, 44, 51, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 12px 22px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 100;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Floating Ambient Hearts -->
  <div class="particles-container" id="particlesContainer"></div>

  <!-- Audio element (plays birthday song) -->
  <audio id="bgAudio" loop preload="auto">
    <source src="assets/birthday-song.mp3" type="audio/mp3">
    <source src="assets/birthday-song.m4a" type="audio/mp4">
  </audio>

  <!-- Main Scanner Layout -->
  <main class="scanner-app">

    <!-- Top Chat Navigation -->
    <header class="header-bar">
      <div class="chat-info">
        <div class="avatar" title="Birthday Girl">💖</div>
        <div class="chat-meta">
          <h2>Dhanya 🎂</h2>
          <span>online</span>
        </div>
      </div>
      <div class="action-icons">
        <button class="icon-btn" id="musicToggle" title="Play / Pause Music" aria-label="Toggle romantic music">🎵</button>
        <button class="icon-btn" id="fsToggle" title="Full Screen Presentation Mode" aria-label="Toggle fullscreen">⛶</button>
      </div>
    </header>

    <!-- Outgoing Bubble 1 -->
    <div class="bubble-wrapper">
      <div class="wa-bubble">
        <span class="bubble-text">Happy birthday!! 🎂❤️</span>
        <span class="bubble-meta">
          <span>2:43 pm</span>
          <span class="bubble-ticks">✓✓</span>
        </span>
      </div>
    </div>

    <!-- Scanner Viewfinder Box (Heart QR Code) -->
    <section class="viewfinder-card" id="qrCard" title="Tap to open the birthday surprise!">
      <!-- Camera Scanner Corner Brackets -->
      <div class="bracket tl"></div>
      <div class="bracket tr"></div>
      <div class="bracket bl"></div>
      <div class="bracket br"></div>

      <!-- Animated Scanning Laser Beam -->
      <div class="scanner-laser" id="laserBeam"></div>

      <!-- Inner White QR Panel -->
      <div class="qr-inner-card">
        <img 
          src="assets/heart-qr-code.png" 
          alt="Romantic Heart Shaped QR Code for Birthday Wishes" 
          class="qr-img" 
          id="qrImage"
        >
      </div>
    </section>

    <!-- Outgoing Bubble 2 -->
    <div class="bubble-wrapper-2">
      <div class="wa-bubble">
        <span class="bubble-text">Open when alone 🤫✨</span>
        <span class="bubble-meta">
          <span>2:44 pm</span>
          <span class="bubble-ticks">✓✓</span>
        </span>
      </div>
    </div>

    <!-- Scanner Controls (Flashlight & Gallery) -->
    <div class="camera-controls">
      <button class="cam-btn" id="flashBtn" title="Toggle Flashlight / Ambient Lighting" aria-label="Toggle Flashlight">
        🔦
      </button>
      <button class="cam-btn" id="galleryBtn" title="View Scanner Card Preview" aria-label="View Scanner Card">
        🖼️
      </button>
    </div>

    <!-- Interactive Buttons -->
    <div class="button-group">
      <a href="index.html" class="primary-btn" id="openSurpriseBtn">
        <span>✨</span>
        <span>Open Birthday Surprise</span>
        <span>→</span>
      </a>

      <div class="secondary-row">
        <a href="assets/heart-qr-code.png" download="Dhanya_Heart_QR.png" class="secondary-btn" id="dlQrBtn">
          <span>📥</span>
          <span>Download QR</span>
        </a>
        <a href="assets/heart-qr-scanner-card.png" download="Dhanya_WhatsApp_Scanner_Card.png" class="secondary-btn" id="dlCardBtn">
          <span>📸</span>
          <span>WhatsApp Card</span>
        </a>
      </div>
    </div>

    <!-- Hint -->
    <p class="scan-hint">
      <span>📱</span> Point any smartphone camera at the heart to scan & open!
    </p>

  </main>

  <!-- Toast Notification -->
  <div class="toast" id="toastMessage"></div>

  <script>
    // Audio Player Toggle
    const audio = document.getElementById('bgAudio');
    const musicBtn = document.getElementById('musicToggle');
    let isPlaying = false;

    musicBtn.addEventListener('click', () => {
      if (isPlaying) {
        audio.pause();
        musicBtn.textContent = '🔇';
        showToast('Music paused');
        isPlaying = false;
      } else {
        audio.play().then(() => {
          musicBtn.textContent = '🎵';
          showToast('Playing romantic birthday melody ✨');
          isPlaying = true;
        }).catch(err => {
          showToast('Tap again to enable audio');
        });
      }
    });

    // Fullscreen Toggle for Laptop Display Presentation
    const fsBtn = document.getElementById('fsToggle');
    fsBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
        fsBtn.textContent = '🗗';
        showToast('Full screen mode enabled');
      } else {
        document.exitFullscreen().catch(() => {});
        fsBtn.textContent = '⛶';
      }
    });

    // Flashlight Toggle
    const flashBtn = document.getElementById('flashBtn');
    let isFlashOn = false;
    flashBtn.addEventListener('click', () => {
      isFlashOn = !isFlashOn;
      flashBtn.classList.toggle('active', isFlashOn);
      if (isFlashOn) {
        document.body.style.filter = 'brightness(1.25)';
        showToast('Flashlight turned ON 💡');
      } else {
        document.body.style.filter = 'none';
        showToast('Flashlight OFF');
      }
    });

    // Gallery Card Preview Toggle
    const galleryBtn = document.getElementById('galleryBtn');
    const qrImg = document.getElementById('qrImage');
    let isCardView = false;
    galleryBtn.addEventListener('click', () => {
      isCardView = !isCardView;
      if (isCardView) {
        qrImg.src = 'assets/heart-qr-scanner-card.png';
        galleryBtn.classList.add('active');
        showToast('Viewing full WhatsApp Card preview');
      } else {
        qrImg.src = 'assets/heart-qr-code.png';
        galleryBtn.classList.remove('active');
        showToast('Viewing Heart QR Code');
      }
    });

    // Tap QR card to directly open the surprise
    const qrCard = document.getElementById('qrCard');
    qrCard.addEventListener('click', () => {
      showToast('Opening Dhanya\'s Birthday Surprise... 💖');
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 600);
    });

    // Toast notification utility
    function showToast(text) {
      const toast = document.getElementById('toastMessage');
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(window._toastTimeout);
      window._toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 2600);
    }

    // Create floating heart particles in background
    function initFloatingHearts() {
      const container = document.getElementById('particlesContainer');
      const symbols = ['💖', '💕', '✨', '🌸', '❤️'];
      const count = 15;

      for (let i = 0; i < count; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart-particle';
        heart.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        heart.style.left = `${Math.random() * 100}vw`;
        heart.style.fontSize = `${16 + Math.random() * 18}px`;
        heart.style.animationDuration = `${9 + Math.random() * 8}s`;
        heart.style.animationDelay = `${Math.random() * 7}s`;
        container.appendChild(heart);
      }
    }

    initFloatingHearts();
  </script>
</body>
</html>
